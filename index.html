<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pannello Attività — Time Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg: #12151C;
    --panel: #1A1E28;
    --panel-raised: #21263200;
    --line: #2A3040;
    --amber: #E8A33D;
    --amber-dim: #6b5227;
    --amber-glow: rgba(232,163,61,0.35);
    --slate: #4A5568;
    --text: #EDEEF0;
    --text-dim: #8B92A0;
    --danger: #C0605A;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 800px 400px at 50% -10%, rgba(232,163,61,0.06), transparent),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
  }

  .masthead{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .masthead h1{
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin:0;
  }

  .masthead .tag{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .total-strip{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 14px 18px;
    margin: 18px 0 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .total-strip .label{
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .total-strip .value{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--amber);
  }

  .add-row{
    display:flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .add-row input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .add-row input:focus{ border-color: var(--amber-dim); }
  .add-row input::placeholder{ color: var(--text-dim); }

  .add-row button{
    background: var(--amber);
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    color: #1A1400;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: filter .15s, transform .05s;
    white-space: nowrap;
  }
  .add-row button:hover{ filter: brightness(1.08); }
  .add-row button:active{ transform: scale(0.97); }

  #list{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }

  .row{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
    overflow: hidden;
  }

  .row:hover{ border-color: #3A4254; }

  .row.active{
    border-color: var(--amber-dim);
    background: linear-gradient(90deg, rgba(232,163,61,0.08), var(--panel) 40%);
  }

  /* toggle switch */
  .switch{
    flex-shrink:0;
    width: 44px;
    height: 24px;
    border-radius: 999px;
    background: #2A3040;
    border: 1px solid #343B4C;
    position: relative;
    transition: background .2s, border-color .2s;
  }
  .row.active .switch{
    background: var(--amber-dim);
    border-color: var(--amber);
  }
  .switch::after{
    content:'';
    position:absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius:50%;
    background: var(--slate);
    transition: transform .2s, background .2s, box-shadow .2s;
  }
  .row.active .switch::after{
    transform: translateX(20px);
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber-glow);
  }

  .row-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction: column;
    gap: 2px;
  }

  .row-name{
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }

  .row-status{
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .row.active .row-status{ color: var(--amber); }

  .row-time{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    flex-shrink:0;
  }
  .row.active .row-time{ color: var(--amber); }

  .row-del{
    flex-shrink:0;
    width: 26px; height: 26px;
    border-radius:6px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .15s, color .15s;
  }
  .row-del:hover{ background: rgba(192,96,90,0.15); color: var(--danger); }

  .empty{
    text-align:center;
    padding: 48px 20px;
    color: var(--text-dim);
    font-size: 13px;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }

  .manage-row{ text-align:right; margin-top: -14px; margin-bottom: 24px; }
  .manage-btn, .prep button{
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 10px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font: 500 12px 'IBM Plex Sans', sans-serif;
  }
  .manage-btn:hover, .prep button:hover{ color: var(--text); border-color: var(--slate); }
  .prep[hidden]{ display:none; }
  .prep{
    position:fixed; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(0,0,0,.6);
  }
  .prep-card{
    width:min(480px, 100%); padding:20px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
  }
  .prep h2{ margin:0 0 6px; font-size:17px; }
  .prep p{ margin:0 0 16px; color:var(--text-dim); font-size:13px; }
  .prep-list{ display:grid; gap:8px; margin-bottom:16px; }
  .prep-choice{ display:flex; gap:9px; align-items:center; padding:9px; border:1px solid var(--line); border-radius:7px; font-size:14px; }
  .prep-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .prep .confirm{ background:var(--amber); border-color:var(--amber); color:#1A1400; }
  footer{
    text-align:center;
    margin-top: 32px;
    font-size: 11px;
    color: #4A5060;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Pannello Attività</h1>
    <span class="tag">Solo una accesa alla volta</span>
  </div>

  <div class="total-strip">
    <span class="label">Totale registrato oggi</span>
    <span class="value" id="totalTime">00:00:00</span>
  </div>

  <div class="add-row">
    <input type="text" id="nameInput" placeholder="Nome attività (es. Email, Riunione, Report...)" maxlength="60">
    <button id="addBtn">Avvia</button>
  </div>
  <div class="manage-row"><button class="manage-btn" id="manageBtn">Gestisci le attività di oggi</button></div>
  <div id="list"></div>

  <div class="prep" id="prepModal" hidden>
    <div class="prep-card" role="dialog" aria-modal="true" aria-labelledby="prepTitle">
      <h2 id="prepTitle">Prepara le attività di oggi</h2>
      <p>Scegli le attività di ieri da rendere disponibili oggi.</p>
      <div class="prep-list" id="yesterdayList"></div>
      <div class="prep-actions">
        <button id="closePrepBtn">Annulla</button>
        <button class="confirm" id="confirmPrepBtn">Porta le attività selezionate a oggi</button>
      </div>
    </div>
  </div>
  <footer>I dati restano salvati in questo browser · nessun account richiesto</footer>
</div>

<script>
  const STORAGE_KEY = 'timeTracker_activities_v1';
  const listEl = document.getElementById('list');
  const totalEl = document.getElementById('totalTime');
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  const manageBtn = document.getElementById('manageBtn');
  const prepEl = document.getElementById('prepModal');
  const yesterdayListEl = document.getElementById('yesterdayList');
  const closePrepBtn = document.getElementById('closePrepBtn');
  const confirmPrepBtn = document.getElementById('confirmPrepBtn');
  const localDate = (timestamp = Date.now()) => {
    const date = new Date(timestamp);
    return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
  };

  function emptyState(){
    return { activities: [], dailyActivities: [], activeActivityId: null, startedAt: null, preparedDays: [] };
  }

  function load(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!saved) return emptyState();

      // Preserve data from the original single-total version as today's total.
      if(Array.isArray(saved)){
        const today = localDate();
        const active = saved.find(a => a.running && Number.isFinite(a.startedAt));
        return {
          activities: saved.map(({ id, name }) => ({ id, name, archived: false })),
          dailyActivities: saved.map(({ id, elapsed = 0 }) => ({ localDate: today, activityId: id, elapsedMs: elapsed })),
          activeActivityId: active ? active.id : null,
          startedAt: active ? active.startedAt : null,
          preparedDays: []
        };
      }

      if(!Array.isArray(saved.activities) || !Array.isArray(saved.dailyActivities)) return emptyState();
      return {
        activities: saved.activities.filter(a => a && a.id && a.name).map(a => ({
          id: a.id, name: a.name, archived: Boolean(a.archived), ...(a.categoryId ? { categoryId: a.categoryId } : {})
        })),
        dailyActivities: saved.dailyActivities.filter(d => d && d.localDate && d.activityId && Number.isFinite(d.elapsedMs)),
        activeActivityId: saved.activeActivityId || null,
        startedAt: Number.isFinite(saved.startedAt) ? saved.startedAt : null,
        preparedDays: [...new Set((saved.preparedDays || []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)))]
      };
    }catch(e){ return emptyState(); }
  }

  let state = load();

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Salvataggio fallito', e); }
  }

  function dailyActivity(activityId, date = localDate()){
    let record = state.dailyActivities.find(d => d.activityId === activityId && d.localDate === date);
    if(!record){
      record = { localDate: date, activityId, elapsedMs: 0 };
      state.dailyActivities.push(record);
    }
    return record;
  }

  function previousLocalDate(){
    const date = new Date();
    date.setDate(date.getDate() - 1);
    return localDate(date);
  }

  function yesterdayActivities(){
    const ids = new Set(state.dailyActivities.filter(d => d.localDate === previousLocalDate()).map(d => d.activityId));
    return state.activities.filter(activity => !activity.archived && ids.has(activity.id));
  }

  function todayActivities(){
    const ids = new Set(state.dailyActivities.filter(d => d.localDate === localDate()).map(d => d.activityId));
    return state.activities.filter(activity => !activity.archived && ids.has(activity.id));
  }

  function prepareToday(ids){
    const yesterdayIds = new Set(yesterdayActivities().map(activity => activity.id));
    ids.filter(id => yesterdayIds.has(id)).forEach(id => dailyActivity(id));
    save();
    render();
  }

  function fmt(ms){
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  }

  function currentElapsed(activity, now = Date.now()){
    const record = state.dailyActivities.find(d => d.activityId === activity.id && d.localDate === localDate());
    const total = record ? record.elapsedMs : 0;
    return activity.id === state.activeActivityId && state.startedAt !== null ? total + Math.max(0, now - state.startedAt) : total;
  }

  function pauseActive(now = Date.now()){
    if(!state.activeActivityId) return;
    const activity = state.activities.find(a => a.id === state.activeActivityId);
    if(activity && state.startedAt !== null){
      let startedAt = state.startedAt;
      while(startedAt < now){
        const midnight = new Date(startedAt);
        midnight.setHours(24, 0, 0, 0);
        const endsAt = Math.min(now, midnight.getTime());
        dailyActivity(activity.id, localDate(startedAt)).elapsedMs += endsAt - startedAt;
        startedAt = endsAt;
      }
    }
    state.activeActivityId = null;
    state.startedAt = null;
  }

  function start(id){
    const now = Date.now();
    pauseActive(now);
    dailyActivity(id);
    state.activeActivityId = id;
    state.startedAt = now;
  }

  function toggle(id){
    if(!state.activities.some(a => a.id === id && !a.archived)) return;
    if(state.activeActivityId === id) pauseActive();
    else start(id);
    save();
    render();
  }

  function addActivity(name){
    name = name.trim();
    if(!name) return;
    const normalized = name.toLocaleLowerCase();
    const existing = state.activities.find(a => !a.archived && a.name.trim().toLocaleLowerCase() === normalized);
    if(existing) start(existing.id);
    else {
      const activity = { id: `a${Date.now()}${Math.random().toString(36).slice(2, 7)}`, name, archived: false };
      state.activities.unshift(activity);
      start(activity.id);
    }
    save();
    render();
  }

  function removeActivity(id){
    if(state.activeActivityId === id) pauseActive();
    state.activities = state.activities.filter(a => a.id !== id);
    state.dailyActivities = state.dailyActivities.filter(d => d.activityId !== id);
    save();
    render();
  }

  function render(){
    listEl.innerHTML = '';
    const activities = todayActivities();
    if(activities.length === 0){
      listEl.innerHTML = '<div class="empty">Nessuna attività ancora. Scrivi un nome sopra e premi "Avvia" per iniziare a tracciare il tempo.</div>';
    } else {
      activities.forEach(activity => {
        const running = activity.id === state.activeActivityId;
        const row = document.createElement('div');
        row.className = 'row' + (running ? ' active' : '');
        row.innerHTML = `
          <div class="switch"></div>
          <div class="row-main">
            <div class="row-name"></div>
            <div class="row-status">${running ? 'In corso' : 'In pausa'}</div>
          </div>
          <div class="row-time">${fmt(currentElapsed(activity))}</div>
          <button class="row-del" title="Elimina attività">✕</button>
        `;
        row.querySelector('.row-name').textContent = activity.name;
        row.addEventListener('click', event => {
          if(!event.target.closest('.row-del')) toggle(activity.id);
        });
        row.querySelector('.row-del').addEventListener('click', event => {
          event.stopPropagation();
          removeActivity(activity.id);
        });
        listEl.appendChild(row);
      });
    }
    updateTotal();
  }
  function updateTotal(){
    const total = todayActivities().reduce((sum, activity) => sum + currentElapsed(activity), 0);
    totalEl.textContent = fmt(total);
  }

  function tick(){
    if(state.activeActivityId && state.startedAt !== null && localDate(state.startedAt) !== localDate()){
      pauseActive();
      save();
      render();
      maybeOpenPreparation();
    }
    const rows = listEl.querySelectorAll('.row');
    todayActivities().forEach((activity, index) => {
      const timeEl = rows[index]?.querySelector('.row-time');
      if(timeEl) timeEl.textContent = fmt(currentElapsed(activity));
    });
    updateTotal();
  }

  addBtn.addEventListener('click', () => {
    addActivity(nameInput.value);
    nameInput.value = '';
    nameInput.focus();
  });

  nameInput.addEventListener('keydown', event => {
    if(event.key === 'Enter'){
      addActivity(nameInput.value);
      nameInput.value = '';
    }
  });

  function openPreparation(){
    const activities = yesterdayActivities();
    yesterdayListEl.innerHTML = '';
    if(!activities.length) yesterdayListEl.textContent = 'Nessuna attività da ieri.';
    activities.forEach(activity => {
      const label = document.createElement('label');
      label.className = 'prep-choice';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = activity.id;
      const name = document.createElement('span');
      name.textContent = activity.name;
      label.appendChild(checkbox);
      label.appendChild(name);
      yesterdayListEl.appendChild(label);
    });
    prepEl.hidden = false;
  }

  function maybeOpenPreparation(){
    const today = localDate();
    if(!state.preparedDays.includes(today) && yesterdayActivities().length){
      state.preparedDays.push(today);
      save();
      openPreparation();
    }
  }

  manageBtn.addEventListener('click', openPreparation);
  closePrepBtn.addEventListener('click', () => { prepEl.hidden = true; });
  confirmPrepBtn.addEventListener('click', () => {
    prepareToday([...yesterdayListEl.querySelectorAll('input:checked')].map(input => input.value));
    prepEl.hidden = true;
  });

  if(state.activeActivityId && state.startedAt !== null && localDate(state.startedAt) !== localDate()) pauseActive();
  save();
  render();
  maybeOpenPreparation();
  setInterval(tick, 1000);
  window.addEventListener('beforeunload', save);
</script>
</body>
</html>
